# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - metatwin

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Docker login to container registry
        uses: docker/login-action@v2
        with:
          registry: mcr.microsoft.com/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_6CBA4D4AA83E4B5F83B2121ED4F4ADB6 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_8D090C650F494EACA1D864322819FDBA }}
          

      - name: Build and Push container to registry
        run: |
          docker build -t mcr.microsoft.com/azure-app-service/windows/parkingpage:${{ github.sha }} .
          docker push mcr.microsoft.com/azure-app-service/windows/parkingpage:${{ github.sha }}
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: "97b0306b-0599-468e-abc7-be3b43d8e449"
          tenant-id: "5ccdfc92-39dc-4f8c-a3bd-6a4afca25ebf"
          subscription-id: "df583b3d-ee71-4c0a-840c-e28b146421f9"

      - name: Deploy container to Azure App Service
        uses: Azure/webapps-deploy@v2
        with:
          app-name: 'metatwin'
          slot-name: 'Production'
          images: 'mcr.microsoft.com/azure-app-service/windows/parkingpage:${{ github.sha }}'
          
